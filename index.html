<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParentConnect AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-dark: #0f172a;
      --chat-bot-bg: #f1f5f9;
      --chat-user-bg: #1e3a8a;
      --chip-bg: #eff6ff;
      --chip-border: #bfdbfe;
      --chip-text: #1d4ed8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar: Just ParentConnect AI */
    header {
      background-color: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-avatar {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .header-title-block h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.2;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: #15803d;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
    }

    .restart-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .restart-btn:hover {
      background-color: #f1f5f9;
      color: var(--text-main);
    }

    /* Full-Screen Scrollable Chat Messages */
    .chat-messages {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background-color: #ffffff;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .msg {
      max-width: 80%;
      padding: 0.85rem 1.1rem;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-bot {
      align-self: flex-start;
      background-color: var(--chat-bot-bg);
      color: var(--text-main);
      border-bottom-left-radius: 3px;
      border: 1px solid #e2e8f0;
    }

    .msg-user {
      align-self: flex-end;
      background-color: var(--chat-user-bg);
      color: white;
      border-bottom-right-radius: 3px;
    }

    .chips-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 0.75rem;
    }

    .chip {
      background-color: var(--chip-bg);
      color: var(--chip-text);
      border: 1px solid var(--chip-border);
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .chip:hover {
      background-color: #dbeafe;
      border-color: #93c5fd;
      transform: translateY(-1px);
    }

    /* Bottom Input Bar */
    .chat-input-container {
      background-color: #ffffff;
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
      flex-shrink: 0;
    }

    .chat-input-wrapper {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 0.65rem;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.92rem;
      outline: none;
      font-family: inherit;
      background-color: #f8fafc;
      transition: all 0.15s ease;
    }

    .chat-input:focus {
      border-color: #3b82f6;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .send-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.4rem;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.15s ease;
    }

    .send-btn:hover {
      background-color: #172554;
    }

    /* Minimal Bottom Footer */
    footer {
      background-color: #ffffff;
      padding: 0.4rem 1.5rem 0.6rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid #f1f5f9;
      flex-shrink: 0;
    }

    footer a {
      color: #2563eb;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

    function sendQuery(text) {
      appendChatMessage(text, 'user');
      processBotResponse(text);
    }

    function submitMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      sendQuery(text);
    }

    function onKeyPress(e) {
      if (e.key === 'Enter') {
        submitMessage();
      }
    }

    function appendChatMessage(text, sender) {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = sender === 'bot' ? 'msg msg-bot' : 'msg msg-user';
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function processBotResponse(rawQuery) {
      const q = rawQuery.toLowerCase().trim();
      let match = knowledgeCatalog[q];

      if (!match) {
        for (let k in knowledgeCatalog) {
          if (q.includes(k) || k.includes(q)) {
            match = knowledgeCatalog[k];
            break;
          }
        }
      }

      setTimeout(() => {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = 'msg msg-bot';

        if (match) {
          div.innerHTML = match.text;
          if (match.chips && match.chips.length > 0) {
            const chipWrap = document.createElement('div');
            chipWrap.className = 'chips-group';
            match.chips.forEach(c => {
              const b = document.createElement('button');
              b.className = 'chip';
              b.textContent = c;
              b.onclick = () => sendQuery(c);
              chipWrap.appendChild(b);
            });
            div.appendChild(chipWrap);
          }
        } else {
          div.innerHTML = "I am here to assist with student attendance, exam dates, fee balances, bus telemetry, or absence reporting. Please choose a topic below:";
          const chipWrap = document.createElement('div');
          chipWrap.className = 'chips-group';
          ["View Attendance", "Exam Schedule", "Fee Details", "Track School Bus", "Main Menu"].forEach(c => {
            const b = document.createElement('button');
            b.className = 'chip';
            b.textContent = c;
            b.onclick = () => sendQuery(c);
            chipWrap.appendChild(b);
          });
          div.appendChild(chipWrap);
        }

        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
      }, 150);
    }
  </script>
</body>
